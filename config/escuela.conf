# config/escuela.conf: publica el sistema en http://IP-DEL-SERVIDOR/escuela/
# Se copia a /etc/apache2/conf-available/ y se activa con: sudo a2enconf escuela
# Apache sirve solo la carpeta public/: config/, src/ y database/ quedan fuera de la web.

# Alias: la URL /escuela apunta a la carpeta public/ del repositorio
Alias /escuela /var/www/sistema-gestion-full/public

<Directory /var/www/sistema-gestion-full/public>
    # -Indexes: si falta el index.php, no muestra la lista de archivos
    Options -Indexes +FollowSymLinks
    # Sin archivos .htaccess: toda la configuración está acá
    AllowOverride None
    # Cualquiera de la red puede pedir estas páginas (quién entra lo decide el login)
    Require all granted
</Directory>
